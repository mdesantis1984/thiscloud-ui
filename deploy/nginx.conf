server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index framework-preview.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        expires -1;
        try_files /framework-preview.html =404;
    }

    location = /downloads {
        expires -1;
        try_files /framework-preview.html =404;
    }

    location = /downloads/ {
        expires -1;
        try_files /framework-preview.html =404;
    }

    location ^~ /downloads/ {
        default_type application/octet-stream;
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|json|ttf|woff2)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
