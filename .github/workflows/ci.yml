name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
          run_install: false
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify web and catalog
        env:
          UI_WEB_CHROME: /usr/bin/google-chrome
        run: pnpm check:web
      - name: Verify release and deployment
        env:
          RELEASE_REGISTRY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:release
      - name: Check patch whitespace
        run: git diff --check

  flutter:
    name: Flutter package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ui_kit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify pinned toolchain
        run: dart run tool/check_toolchain.dart
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze package
        run: flutter analyze
      - name: Test package and guards
        run: flutter test
      - name: Verify package boundaries
        run: |
          dart run tool/check_boundaries.dart .
          dart run tool/check_public_api.dart .
          dart run tool/check_licenses.dart .
