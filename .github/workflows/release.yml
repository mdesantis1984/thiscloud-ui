name: Release web package and catalog

on:
  push:
    tags:
      - ui-web-v*

permissions: {}

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
          run_install: false
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and release assets
        env:
          UI_WEB_CHROME: /usr/bin/google-chrome
        run: |
          version="$(node -p "require('./packages/ui-web/package.json').version")"
          test "$GITHUB_REF_NAME" = "ui-web-v$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm check:web
          pnpm check:release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/ui-web/package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "tmp/release/thiscloud-ui-web-$version.tgz#@thiscloud/ui-web $version tarball" \
            "tmp/release/thiscloud-ui-web-$version.tgz.sha256#SHA-256 checksum" \
            --draft --generate-notes --title "@thiscloud/ui-web $version" --verify-tag
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish catalog image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
