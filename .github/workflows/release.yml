name: Release web package and catalog

on:
  push:
    tags:
      - ui-web-v*

permissions: {}

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
          run_install: false
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and release assets
        env:
          UI_WEB_CHROME: /usr/bin/google-chrome
        run: |
          version="$(node -p "require('./packages/ui-web/package.json').version")"
          test "$GITHUB_REF_NAME" = "ui-web-v$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm check:web
          pnpm check:release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/ui-web/package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "tmp/release/thiscloud-ui-web-$version.tgz#@thiscloud/ui-web $version tarball" \
            "tmp/release/thiscloud-ui-web-$version.tgz.sha256#SHA-256 checksum" \
            --draft --generate-notes --title "@thiscloud/ui-web $version" --verify-tag
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish catalog image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
