version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    labels: ["type:chore"]
    schedule:
      interval: weekly
      day: monday
    groups:
      node-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    labels: ["type:chore"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    labels: ["type:chore"]
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /packages/ui_kit
    target-branch: develop
    labels: ["type:chore"]
    schedule:
      interval: weekly
      day: monday
