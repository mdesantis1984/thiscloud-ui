analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
    - use_super_parameters
